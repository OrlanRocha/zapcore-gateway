<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Sem conexao | ZapCore Gateway</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #eafff7; color: #111827; font-family: system-ui, sans-serif; }
    main { width: min(420px, 100%); text-align: center; }
    img { width: 88px; height: 88px; border-radius: 26px; box-shadow: 0 18px 50px rgba(17, 24, 39, 0.18); }
    h1 { margin: 28px 0 8px; font-size: 28px; letter-spacing: 0; }
    p { margin: 0 0 24px; color: #4b5563; line-height: 1.6; }
    button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: #111827; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/images/zapcore-icon.svg" alt="ZapCore Gateway" width="88" height="88">
    <h1>Sem conexao</h1>
    <p>Reconecte-se a internet para acessar suas instancias e mensagens.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
