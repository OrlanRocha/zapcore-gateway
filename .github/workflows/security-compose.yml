name: Security Compose validation

on:
  pull_request:
    paths:
      - 'docker-compose*.yml'
      - 'docker/**'
      - 'scripts/validate-compose-linux.sh'
      - 'secrets/examples/**'
      - 'backend-php/**'
      - 'worker-baileys/**'
      - '.github/workflows/security-compose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker-baileys/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, pdo_mysql
          coverage: none
      - name: Install worker dependencies
        working-directory: worker-baileys
        run: npm ci
      - name: Run Node policy and regression tests
        working-directory: worker-baileys
        run: npm test
      - name: Build TypeScript
        working-directory: worker-baileys
        run: npm run build
      - name: Install PHP dependencies
        working-directory: backend-php
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run PHP regression tests
        working-directory: backend-php
        run: composer test
      - name: Validate isolated Compose runtime
        run: bash scripts/validate-compose-linux.sh
